<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f6ee">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23f5f6ee%22 stroke=%22%23222%22 stroke-width=%221.5%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%229%22 fill=%22none%22 stroke=%22%23222%22 stroke-width=%221%22/%3E%3C/svg%3E">
    <title>Рецепты | Polkovniki Lubvi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="style.css?v=7">
    <link rel="stylesheet" href="menu.css?v=8">
</head>
<body class="app">
    <header class="app-top">
        <a href="index.html" class="wordmark">Polkovniki Lubvi</a>
        <button class="pill view-pill" id="viewPill" type="button" aria-controls="menu">
            <svg class="dots" viewBox="0 0 9 9" aria-hidden="true"><circle cx="1" cy="1" r="1"/><circle cx="4.5" cy="1" r="1"/><circle cx="8" cy="1" r="1"/><circle cx="1" cy="4.5" r="1"/><circle cx="4.5" cy="4.5" r="1"/><circle cx="8" cy="4.5" r="1"/><circle cx="1" cy="8" r="1"/><circle cx="4.5" cy="8" r="1"/><circle cx="8" cy="8" r="1"/></svg>
            <span id="viewName">Все блюда</span>
            <span class="count" id="viewCount"></span>
        </button>
    </header>

    <main class="stage" id="stage" aria-label="Блюда">
        <div class="canvas" id="canvas"></div>
    </main>

    <div class="empty" id="emptyState" hidden>
        <p class="empty-title" id="emptyTitle"></p>
        <p class="empty-text" id="emptyText"></p>
        <button class="btn" type="button" id="emptyButton">Показать все блюда</button>
    </div>

    <nav class="menu" id="menu" aria-label="Категории">
        <ul class="menu-list" id="menuList"></ul>
        <div class="menu-foot">
            <a href="index.html">← На главную</a>
            <span class="count" id="menuTotal"></span>
        </div>
    </nav>

    <div class="controls">
        <button class="btn" id="menuButton" type="button" aria-expanded="false" aria-controls="menu">
            <svg class="burger" viewBox="0 0 12 9" aria-hidden="true"><line class="l1" x1="0" y1="0.75" x2="12" y2="0.75"/><line class="l2" x1="0" y1="4.5" x2="12" y2="4.5"/><line class="l3" x1="0" y1="8.25" x2="12" y2="8.25"/></svg>
            меню
        </button>
        <button class="btn" id="favoriteIcon" type="button">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5S1.5 9.6 1.5 5.4A3.1 3.1 0 0 1 8 4a3.1 3.1 0 0 1 6.5 1.4C14.5 9.6 8 13.5 8 13.5z"/></svg>
            избранное
            <span class="count" id="favCount"></span>
        </button>
    </div>

    <div class="zoom">
        <p class="hint" id="dragHint">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1v14M1 8h14M8 1 6 3M8 1l2 2M8 15l-2-2M8 15l2-2M1 8l2-2M1 8l2 2M15 8l-2-2M15 8l-2 2"/></svg>
            тяните, чтобы смотреть
        </p>
        <div class="zoom-buttons">
            <button class="zoom-btn" id="zoomIn" type="button" aria-label="Крупнее"><svg class="icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1v8M1 5h8"/></svg></button>
            <button class="zoom-btn" id="zoomOut" type="button" aria-label="Мельче"><svg class="icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8"/></svg></button>
        </div>
    </div>

    <div class="scrim" id="scrim"></div>

    <aside class="recipe" id="recipe" role="dialog" aria-modal="true" aria-labelledby="recipeName">
        <div class="recipe-handle" id="drawerHandle"><span></span></div>
        <div class="recipe-scroll" id="recipeScroll">
            <div class="recipe-head">
                <h2 class="recipe-name" id="recipeName"></h2>
                <div class="recipe-actions">
                    <button class="icon-btn fav-btn" id="savePhoto" type="button" aria-pressed="false" aria-label="В избранное">
                        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5S1.5 9.6 1.5 5.4A3.1 3.1 0 0 1 8 4a3.1 3.1 0 0 1 6.5 1.4C14.5 9.6 8 13.5 8 13.5z"/></svg>
                    </button>
                    <button class="icon-btn" id="closeRecipe" type="button" aria-label="Закрыть">
                        <svg class="icon" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2 2 12"/></svg>
                    </button>
                </div>
            </div>
            <img class="recipe-photo" id="recipePhoto" src="data:," alt="">
            <p class="recipe-desc" id="recipeDesc"></p>
            <dl class="nutrition" id="nutrition"></dl>

            <div class="tabs" role="tablist">
                <button class="pill tab-btn is-active" type="button" role="tab" data-tab="ingredients" id="tabIngredients" aria-selected="true">Ингредиенты <span class="count" id="ingredientsCount"></span></button>
                <button class="pill tab-btn" type="button" role="tab" data-tab="cooking" id="tabCooking" aria-selected="false">Приготовление <span class="count" id="stepsCount"></span></button>
            </div>

            <div class="tab-pane" id="ingredients" role="tabpanel" aria-labelledby="tabIngredients">
                <ul class="ingredients-list" id="ingredientsList"></ul>
                <button class="btn save-ingredients-btn" id="saveIngredientsBtn" type="button">Скопировать выбранные</button>
            </div>
            <div class="tab-pane" id="cooking" role="tabpanel" aria-labelledby="tabCooking" hidden>
                <ol class="cooking-list" id="cookingList"></ol>
                <p class="bon-appetit">Приятного аппетита!</p>
            </div>
        </div>
    </aside>

    <div class="custom-alert" id="customAlert" role="alertdialog" aria-modal="true" aria-labelledby="customAlertTitle">
        <div class="dialog-card">
            <p class="dialog-title" id="customAlertTitle"></p>
            <p class="dialog-text" id="customAlertText"></p>
            <button class="btn" id="customAlertBtn" type="button">Хорошо</button>
        </div>
    </div>

    <div class="step-detail-alert" id="stepDetailAlert" role="dialog" aria-modal="true" aria-labelledby="stepDetailTitle">
        <div class="dialog-card">
            <p class="dialog-title" id="stepDetailTitle">Для этого шага</p>
            <ul class="dialog-list" id="stepDetailList"></ul>
            <button class="btn" id="stepDetailBtn" type="button">Понятно!</button>
        </div>
    </div>

    <div class="page-fade" id="pageFade"></div>

    <script src="recipes.js?v=1"></script>
    <script src="menu.js?v=8"></script>
</body>
</html>
