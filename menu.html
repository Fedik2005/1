<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%231a4be0%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%229%22 fill=%22%23ffffff%22/%3E%3C/svg%3E">
    <title>Рецепты | Polkovniki Lubvi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="style.css?v=13">
    <link rel="stylesheet" href="menu.css?v=13">
</head>
<body class="app">
    <header class="app-top">
        <a href="index.html" class="wordmark app-mark">Polkovniki Lubvi</a>
        <h1 class="app-title" id="appTitle">Все блюда</h1>
        <button class="top-link" id="viewToggle" type="button" aria-pressed="false">
            <span id="viewToggleLabel">Список блюд</span>
        </button>
    </header>

    <main class="stage" id="stage" aria-label="Блюда">
        <div class="canvas" id="canvas"></div>
    </main>

    <div class="empty" id="emptyState" hidden>
        <p class="empty-title" id="emptyTitle"></p>
        <p class="empty-text" id="emptyText"></p>
        <button class="btn" type="button" id="emptyButton">Показать все блюда</button>
    </div>

    <!-- Список блюд: открывается верхней кнопкой -->
    <section class="sections" id="sections" aria-labelledby="sectionsTitle" hidden>
        <h2 class="sections-title" id="sectionsTitle">Что приготовить сегодня</h2>
        <nav class="sections-jump" id="sectionsJump" aria-label="Разделы"></nav>
        <div class="sections-grid" id="sectionsGrid"></div>
    </section>

    <!-- Меню: всплывающие плашки с категориями -->
    <nav class="menu-chips" id="menu" aria-label="Категории">
        <ul id="menuList"></ul>
    </nav>

    <div class="controls">
        <button class="btn menu-toggle" id="menuButton" type="button" aria-expanded="false" aria-controls="menu">
            <svg class="burger" viewBox="0 0 16 12" aria-hidden="true"><line class="l1" x1="0" y1="1" x2="16" y2="1"/><line class="l2" x1="0" y1="6" x2="16" y2="6"/><line class="l3" x1="0" y1="11" x2="16" y2="11"/></svg>
            <span class="menu-toggle-label">Меню</span>
        </button>
        <button class="btn btn-soft fav-toggle" id="favoriteIcon" type="button" aria-pressed="false">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5S1.5 9.6 1.5 5.4A3.1 3.1 0 0 1 8 4a3.1 3.1 0 0 1 6.5 1.4C14.5 9.6 8 13.5 8 13.5z"/></svg>
            Избранное <span class="count" id="favCount"></span>
        </button>
    </div>

    <div class="zoom">
        <p class="hint" id="dragHint">Тяните, чтобы смотреть</p>
        <button class="zoom-btn" id="zoomOut" type="button" aria-label="Отдалить"><svg class="icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8"/></svg></button>
        <button class="zoom-btn" id="zoomIn" type="button" aria-label="Приблизить"><svg class="icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1v8M1 5h8"/></svg></button>
    </div>

    <!-- Рецепт: панель слева, блюдо крупно на поле своего ингредиента -->
    <aside class="recipe" id="recipe" role="dialog" aria-modal="true" aria-labelledby="recipeName">
        <div class="recipe-scroll" id="recipeScroll">
            <div class="recipe-hero">
                <div class="recipe-hero-text">
                    <h2 class="recipe-name" id="recipeName"></h2>
                    <p class="recipe-facts" id="recipeFacts"></p>
                    <div class="recipe-hero-row">
                        <button class="btn fav-btn" id="savePhoto" type="button" aria-pressed="false">
                            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5S1.5 9.6 1.5 5.4A3.1 3.1 0 0 1 8 4a3.1 3.1 0 0 1 6.5 1.4C14.5 9.6 8 13.5 8 13.5z"/></svg>
                            <span id="savePhotoLabel">В избранное</span>
                        </button>
                        <p class="recipe-swatch" id="recipeSwatch"></p>
                    </div>
                </div>
                <div class="recipe-media">
                    <img class="recipe-photo" id="recipePhoto" src="data:," alt="">
                </div>
            </div>

            <div class="recipe-sheet">
                <p class="recipe-desc" id="recipeDesc"></p>

                <div class="tabs" role="tablist">
                    <button class="tab-btn is-active" type="button" role="tab" data-tab="ingredients" id="tabIngredients" aria-selected="true">Ингредиенты <span class="count" id="ingredientsCount"></span></button>
                    <button class="tab-btn" type="button" role="tab" data-tab="cooking" id="tabCooking" aria-selected="false">Приготовление <span class="count" id="stepsCount"></span></button>
                </div>

                <div class="tab-pane" id="ingredients" role="tabpanel" aria-labelledby="tabIngredients">
                    <ul class="ingredients-list" id="ingredientsList"></ul>
                    <button class="btn btn-accent save-ingredients-btn" id="saveIngredientsBtn" type="button">
                        <span id="saveIngredientsLabel">Скопировать выбранные</span>
                        <svg class="icon" viewBox="0 0 16 10" aria-hidden="true"><path d="M1 5h14M11 9l4-4-4-4"/></svg>
                    </button>
                </div>
                <div class="tab-pane" id="cooking" role="tabpanel" aria-labelledby="tabCooking" hidden>
                    <ol class="cooking-list" id="cookingList"></ol>
                </div>
            </div>

            <p class="bon-appetit">Приятного аппетита!</p>
        </div>
    </aside>
    <button class="close-square" id="closeRecipe" type="button" aria-label="Закрыть рецепт">
        <svg class="icon" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2 2 12"/></svg>
    </button>

    <div class="custom-alert" id="customAlert" role="alertdialog" aria-modal="true" aria-labelledby="customAlertTitle">
        <div class="dialog-card">
            <p class="dialog-title" id="customAlertTitle"></p>
            <p class="dialog-text" id="customAlertText"></p>
            <button class="btn btn-accent" id="customAlertBtn" type="button">Хорошо</button>
        </div>
    </div>

    <div class="step-detail-alert" id="stepDetailAlert" role="dialog" aria-modal="true" aria-labelledby="stepDetailTitle">
        <div class="dialog-card">
            <p class="dialog-title" id="stepDetailTitle">Для этого шага</p>
            <ul class="dialog-list" id="stepDetailList"></ul>
            <button class="btn btn-accent" id="stepDetailBtn" type="button">Понятно!</button>
        </div>
    </div>

    <div class="page-fade" id="pageFade"></div>

    <script src="recipes.js?v=4"></script>
    <script src="menu.js?v=13"></script>
</body>
</html>
